name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none
      # rnscommerce/php-webdriver-bidi and rnscommerce/codeception-module-webdriver-bidi are private; each read-only
      # deploy key lets composer clone its repository, and has to carry that repository's SSH URL as its comment.
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.PHP_WEBDRIVER_BIDI_DEPLOY_KEY }}
            ${{ secrets.CODECEPTION_MODULE_WEBDRIVER_BIDI_DEPLOY_KEY }}
      - run: composer install --no-interaction
      - name: Code style
        run: composer cs
      - name: PHPStan
        run: composer stan

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.PHP_WEBDRIVER_BIDI_DEPLOY_KEY }}
            ${{ secrets.CODECEPTION_MODULE_WEBDRIVER_BIDI_DEPLOY_KEY }}
      - run: composer install --no-interaction
      - name: Locate the runner's driver
        run: echo "CHROMEDRIVER=$CHROMEWEBDRIVER/chromedriver" >> "$GITHUB_ENV"
      - run: composer test:integration
